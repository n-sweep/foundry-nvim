[project]
name = "foundry-nvim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29.5",
    "jupyter-client>=8.6.3",
    "pandas>=2.3.1",
    "plotly>=6.2.0",
    "pynvim>=0.5.2",
    "pyperclip>=1.9.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:jupyter_client.*"
]
log_cli = true
log_cli_level = "INFO"
pythonpath = ["."]
